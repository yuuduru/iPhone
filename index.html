<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>yuuduru's tools</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', 'Hiragino Sans', 'Noto Sans JP', sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 500;
      color: #444;
      margin-bottom: 40px;
      letter-spacing: 0.02em;
    }

    .cards {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      max-width: 900px;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 28px 32px;
      width: 260px;
      text-decoration: none;
      color: inherit;
      transition: box-shadow 0.2s, transform 0.2s;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card:hover {
      box-shadow: 0 6px 20px rgba(0,0,0,0.15);
      transform: translateY(-2px);
    }

    .card-icon {
      font-size: 2.4rem;
      line-height: 1;
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: #222;
    }

    .card-desc {
      font-size: 0.85rem;
      color: #777;
      line-height: 1.5;
    }

    .card-arrow {
      font-size: 0.8rem;
      color: #aaa;
      margin-top: 4px;
      align-self: flex-end;
    }

    @media (max-width: 600px) {
      .card { width: 100%; max-width: 320px; }
    }
  </style>
</head>
<body>
  <h1>yuuduru's tools</h1>
  <div class="cards">
    <a class="card" href="bus/">
      <div class="card-icon">&#x1F68C;</div>
      <div class="card-title">岩戸南バス時刻表</div>
      <div class="card-desc">ルミエール狛江周辺のバス停と<br>リアルタイム時刻を表示</div>
      <div class="card-arrow">→</div>
    </a>
    <a class="card" href="timeline/">
      <div class="card-icon">&#x1F5FA;&#xFE0F;</div>
      <div class="card-title">Google Maps タイムライン</div>
      <div class="card-desc">Google Takeout のロケーション<br>履歴を地図上に可視化</div>
      <div class="card-arrow">→</div>
    </a>
    <a class="card" href="recipes/">
      <div class="card-icon">&#x1F373;</div>
      <div class="card-title">長谷川あかりのレシピ集</div>
      <div class="card-desc">人気レシピ20品を<br>カテゴリ別に検索・管理</div>
      <div class="card-arrow">→</div>
    </a>
  </div>
</body>
</html>
